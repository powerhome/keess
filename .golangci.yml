version: "2"

linters:
  exclusions:
    rules:
      # corev1.Endpoints is kept until the EndpointSlice migration happens.
      # staticcheck reports the alias (corev1.Endpoints) on older versions and
      # the full import path (k8s.io/api/core/v1.Endpoints) since v2.13.
      - path: pkg/keess/net/
        linters:
          - staticcheck
        text: "(corev1|k8s\\.io/api/core/v1)\\.(Endpoints|EndpointSubset) is deprecated"
