name: Python E2E

on:
  pull_request:

jobs:
  python-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KUBECONFIG_FILE: localTestKubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind and kubectl
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Create kind cluster
        run: make create-python-e2e-cluster

      # Keess runs on the runner, like `make run` locally; the tests only need it
      # to reach the cluster through the same kubeconfig.
      - name: Start Keess
        run: |
          make build
          nohup make run > keess.log 2>&1 &
          for _ in $(seq 1 24); do
            if grep -q 'Remote clusters successfully initialized: \[kind-source-cluster\]' keess.log; then
              grep 'Remote clusters successfully initialized' keess.log
              exit 0
            fi
            sleep 5
          done
          echo "::error::Keess did not connect to kind-source-cluster"
          cat keess.log
          exit 1

      - name: Run Python e2e tests
        run: make tests-python-e2e

      - name: Dump cluster state and Keess logs
        if: failure()
        run: |
          echo "::group::pods"
          kubectl --kubeconfig "$KUBECONFIG_FILE" --context kind-source-cluster get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::keess.log"
          cat keess.log || true
          echo "::endgroup::"
