name: E2E

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  python-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KUBECONFIG_FILE: localTestKubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.18.3"
          install-only: true

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kind and kubectl
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Set up kind clusters with Keess
        run: make setup-local-clusters-with-keess

      # Keess connects to remote clusters once at startup and doesn't retry a
      # failure until the kubeconfig changes (#77). Check it here, so that case
      # fails with a clear message instead of as scenario 5 sync errors.
      - name: Wait for Keess remote clusters
        run: |
          for ctx in kind-source-cluster kind-destination-cluster; do
            kubectl --kubeconfig "$KUBECONFIG_FILE" --context "$ctx" -n keess rollout status deploy/keess --timeout=120s
            ok=false
            for _ in $(seq 1 24); do
              line=$(kubectl --kubeconfig "$KUBECONFIG_FILE" --context "$ctx" -n keess logs deploy/keess \
                | grep 'Remote clusters successfully initialized' | tail -n 1 || true)
              if echo "$line" | grep -q kind-source-cluster && echo "$line" | grep -q kind-destination-cluster; then
                echo "$ctx: $line"
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "::error::Keess on $ctx did not initialize both remote clusters (see powerhome/keess#77)"
              exit 1
            fi
          done

      - name: Run Python e2e tests
        run: make tests-python-e2e

      - name: Dump cluster state
        if: failure()
        run: |
          for ctx in kind-source-cluster kind-destination-cluster; do
            echo "::group::$ctx pods"
            kubectl --kubeconfig "$KUBECONFIG_FILE" --context "$ctx" get pods -A -o wide || true
            echo "::endgroup::"
            echo "::group::$ctx keess logs"
            kubectl --kubeconfig "$KUBECONFIG_FILE" --context "$ctx" -n keess logs deploy/keess --all-containers || true
            echo "::endgroup::"
          done
